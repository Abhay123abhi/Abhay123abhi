<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="line" x1="160" y1="170" x2="840" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="258" rx="23" stroke="#243244"/>

  <text x="56" y="66" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">ABHAY JAISWAL</text>
  <text x="56" y="101" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Backend Engineer · Distributed Systems · Production Reliability</text>
  <text x="56" y="132" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Backend first. Production minded.</text>

  <line x1="170" y1="188" x2="830" y2="188" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle">
    <rect x="112" y="164" width="116" height="48" rx="12" fill="#111827" stroke="#22C55E"/>
    <text x="170" y="193" fill="#E2E8F0">API / BFF</text>

    <rect x="314" y="164" width="116" height="48" rx="12" fill="#111827" stroke="#38BDF8"/>
    <text x="372" y="193" fill="#E2E8F0">KAFKA</text>

    <rect x="516" y="164" width="116" height="48" rx="12" fill="#111827" stroke="#60A5FA"/>
    <text x="574" y="193" fill="#E2E8F0">WORKER</text>

    <rect x="718" y="164" width="116" height="48" rx="12" fill="#111827" stroke="#A78BFA"/>
    <text x="776" y="193" fill="#E2E8F0">POSTGRES</text>
  </g>

  <circle r="6" fill="#22C55E" filter="url(#glow)">
    <animateMotion dur="4.8s" repeatCount="indefinite" path="M170 188 H776"/>
  </circle>
  <circle r="4" fill="#38BDF8" opacity="0.9">
    <animateMotion dur="4.8s" begin="1.6s" repeatCount="indefinite" path="M170 188 H776"/>
  </circle>
  <circle r="4" fill="#A78BFA" opacity="0.9">
    <animateMotion dur="4.8s" begin="3.2s" repeatCount="indefinite" path="M170 188 H776"/>
  </circle>

  <text x="944" y="238" fill="#475569" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" text-anchor="end">SYSTEM / PROFILE</text>
</svg>
