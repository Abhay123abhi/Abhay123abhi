<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Abhay Jaiswal — Backend Engineer · Distributed Systems · Applied AI</title>
<desc id="desc">A navy banner with a softly animated teal-to-violet line and a compact focus terminal. Reliable systems, grounded AI, thoughtful interfaces.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1000" y2="240" gradientUnits="userSpaceOnUse"><stop stop-color="#0F172A"/><stop offset=".55" stop-color="#111827"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
<linearGradient id="accent" x1="64" y1="108" x2="494" y2="108" gradientUnits="userSpaceOnUse"><stop stop-color="#34D399"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity=".07"/></pattern>
</defs>
<style>
.signal{animation:signal 6s linear infinite}
.cursor{animation:blink 2s ease-in-out infinite}
.light{animation:pulse 4s ease-in-out infinite}
@keyframes signal{from{transform:translateX(0)}to{transform:translateX(424px)}}
@keyframes blink{50%{opacity:.15}}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.signal,.cursor,.light{animation:none}}
</style>
<rect width="1000" height="240" rx="24" fill="url(#bg)"/>
<rect x="578" y="16" width="400" height="208" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="998" height="238" rx="23" stroke="#243145"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="64" y="52" font-size="11" letter-spacing="2.8" fill="#64748B">BUILD WITH INTENT</text>
<text x="64" y="91" font-size="36" font-weight="700" letter-spacing="-.8" fill="#F8FAFC">Abhay Jaiswal</text>
<path d="M64 108H494" stroke="url(#accent)" stroke-width="1.5"/>
<circle class="signal" cx="67" cy="108" r="3" fill="#5EEAD4"/>
<text x="64" y="140" font-size="16" fill="#CBD5E1">Backend Engineer · Distributed Systems · Applied AI</text>
<text x="64" y="170" font-size="14" fill="#94A3B8">Reliable systems. Grounded AI. Thoughtful interfaces.</text>
<text x="64" y="202" font-size="12" fill="#64748B">Learning through building, measuring, and contributing.</text>
</g>
<rect x="600" y="48" width="336" height="144" rx="16" fill="#0B1220" stroke="#243145"/>
<circle cx="620" cy="67" r="3" fill="#334155"/><circle cx="633" cy="67" r="3" fill="#334155"/><circle cx="646" cy="67" r="3" fill="#334155"/>
<circle class="light" cx="916" cy="67" r="3" fill="#34D399"/>
<path d="M601 83H935" stroke="#1E293B"/>
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">
<text x="620" y="106" fill="#64748B">$ focus</text>
<rect class="cursor" x="679" y="96" width="7" height="12" rx="1" fill="#5EEAD4"/>
<text x="620" y="132" fill="#5EEAD4">backend</text><text x="691" y="132" fill="#CBD5E1">: APIs / events / systems</text>
<text x="620" y="153" fill="#7DD3FC">AI</text><text x="691" y="153" fill="#CBD5E1">: RAG / retrieval / LLMs</text>
<text x="620" y="174" fill="#C4B5FD">frontend</text><text x="691" y="174" fill="#CBD5E1">: React / real-time UX</text>
</g>
</svg>
