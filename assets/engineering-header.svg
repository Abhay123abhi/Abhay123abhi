<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
<title id="title">Abhay Jaiswal — Backend engineering and applied AI</title>
<desc id="desc">A dark navy engineering banner with teal and blue accents. Backend, applied AI, frontend, and open source.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#15233B"/></linearGradient>
<linearGradient id="line"><stop stop-color="#5EEAD4"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".065"/></pattern>
</defs>
<style>
.flow{stroke-dasharray:6 12;animation:flow 8s linear infinite}
.halo{animation:breathe 5s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-144}}
@keyframes breathe{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.flow,.halo{animation:none}}
</style>
<rect width="1000" height="310" rx="24" fill="url(#bg)"/>
<rect width="1000" height="310" rx="24" fill="url(#grid)"/>
<rect x="1" y="1" width="998" height="308" rx="23" fill="none" stroke="#29364B"/>
<rect x="42" y="39" width="4" height="18" rx="2" fill="#5EEAD4"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="58" y="53" font-size="12" letter-spacing="3" fill="#94A3B8">BUILD / OBSERVE / IMPROVE</text>
<text x="42" y="114" font-size="47" font-weight="700" letter-spacing="-1" fill="#F8FAFC">Abhay Jaiswal</text>
<text x="44" y="152" font-size="21" fill="#CBD5E1">Backend engineering. Applied AI.</text>
<text x="44" y="183" font-size="16" fill="#94A3B8">Reliable APIs, grounded AI, and usable interfaces.</text>
<g font-size="12" fill="#CCFBF1" text-anchor="middle">
<rect x="44" y="214" width="95" height="28" rx="14" fill="#112D32" stroke="#245456"/><text x="91" y="233">JAVA</text>
<rect x="149" y="214" width="124" height="28" rx="14" fill="#112D32" stroke="#245456"/><text x="211" y="233">SPRING BOOT</text>
<rect x="283" y="214" width="96" height="28" rx="14" fill="#112D32" stroke="#245456"/><text x="331" y="233">REACT</text>
<rect x="389" y="214" width="124" height="28" rx="14" fill="#112D32" stroke="#245456"/><text x="451" y="233">OPEN SOURCE</text>
</g>
<rect x="654" y="48" width="300" height="207" rx="16" fill="#0B1220" stroke="#334155"/>
<circle cx="675" cy="68" r="3" fill="#5EEAD4"/><circle cx="689" cy="68" r="3" fill="#38BDF8"/><circle cx="703" cy="68" r="3" fill="#A78BFA"/>
<text x="677" y="111" fill="#64748B" font-size="11" letter-spacing="2">ENGINEERING FOCUS</text>
<g font-size="16" fill="#E2E8F0">
<text x="677" y="144">01  /  APIs &amp; events</text>
<text x="677" y="177">02  /  Retrieval &amp; LLMs</text>
<text x="677" y="210">03  /  End-to-end experiences</text>
</g>
<circle class="halo" cx="928" cy="68" r="5" fill="#5EEAD4" opacity=".9"/>
</g>
<path d="M44 277H954" stroke="#29364B" stroke-width="2"/>
<path class="flow" d="M44 277H954" stroke="url(#line)" stroke-width="2"/>
</svg>
